# Docker Swarm + Traefik v3 + Portainer + servicio de ejemplo
# Deploy: ./deploy.sh   (lee .env y ejecuta docker stack deploy)
services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false     # solo se publica lo que tenga traefik.enable=true
      - --providers.swarm.network=proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --api.dashboard=true
      - --metrics.prometheus=true                     # métricas en :8080/metrics para Prometheus
      - --accesslog=true
      - --log.level=INFO
    ports:
      - { target: 80, published: 80, mode: host }
      - { target: 443, published: 443, mode: host }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [proxy]
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        # Dashboard en https://traefik.DOMAIN protegido con usuario y contraseña
        - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)
        - traefik.http.routers.dashboard.entrypoints=websecure
        - traefik.http.routers.dashboard.service=api@internal
        - traefik.http.routers.dashboard.middlewares=auth@swarm,secure-headers@swarm
        - traefik.http.services.dashboard.loadbalancer.server.port=8080
        # Middlewares reutilizables por cualquier servicio
        - traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_BASIC_AUTH}
        - traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000
        - traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true
        - traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true
        - traefik.http.middlewares.secure-headers.headers.frameDeny=true
        - traefik.http.middlewares.secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin
        - traefik.http.middlewares.rate-limit.ratelimit.average=50
        - traefik.http.middlewares.rate-limit.ratelimit.burst=100

  portainer-agent:
    image: portainer/agent:2.21.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks: [agent]
    deploy:
      mode: global                                    # un agente por nodo del clúster

  portainer:
    image: portainer/portainer-ce:2.21.0
    command: -H tcp://tasks.portainer-agent:9001 --tlsskipverify
    volumes:
      - portainer-data:/data
    networks: [agent, proxy]
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)
        - traefik.http.routers.portainer.entrypoints=websecure
        - traefik.http.routers.portainer.middlewares=secure-headers@swarm
        - traefik.http.services.portainer.loadbalancer.server.port=9000

  # Servicio de ejemplo: copiá este bloque para publicar tus propias apps
  whoami:
    image: traefik/whoami:v1.10
    networks: [proxy]
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first                            # actualiza sin cortar el servicio
      labels:
        - traefik.enable=true
        - traefik.http.routers.whoami.rule=Host(`whoami.${DOMAIN}`)
        - traefik.http.routers.whoami.entrypoints=websecure
        - traefik.http.routers.whoami.middlewares=secure-headers@swarm,rate-limit@swarm
        - traefik.http.services.whoami.loadbalancer.server.port=80

networks:
  proxy:
    external: true                                    # la crea deploy.sh, la comparten todos los stacks
  agent:
    driver: overlay
    attachable: true

volumes:
  letsencrypt:
  portainer-data:
